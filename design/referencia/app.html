<!doctype html>
<html lang="es-UY">
<head>
<meta charset="utf-8">
<title>Mostrame · pantallas</title>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="app.css">
<script src="icons.js"></script>
</head>
<body>
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const S = q.get('s') || 'inicio';
document.documentElement.dataset.textScale = q.get('scale') || '1.2';
document.documentElement.dataset.theme = q.get('theme') || 'light';
const dark = q.get('theme') === 'dark';
const SYM = dark ? '../brand/mostrame-simbolo-oscuro.svg' : '../brand/mostrame-simbolo.svg';
const LOGO = dark ? '../brand/mostrame-logo-oscuro.svg' : '../brand/mostrame-logo.svg';
const I = (n, c = '') => `<span class="ic ${c}" aria-hidden="true">${ICONS[n]}</svg></span>`;
let DOM = { sub: 'agenda.', main: 'ejemplo.gub.uy' };
let GOAL = 'Renovar la cédula en Uruguay';

/* ---------- Barra del navegador ---------- */
const chrome = (site, helpOn = true) => `
<header class="chrome">
  <a class="brand" href="#" aria-label="Mostrame, ir al inicio"><img src="${LOGO}" alt="Mostrame"></a>
  <div class="nav">
    <button class="btn btn-chrome icon-only" aria-label="Inicio">${I('house')}</button>
    <button class="btn btn-chrome icon-only" aria-label="Página anterior" ${site ? '' : 'disabled style="opacity:.4"'}>${I('arrow-left')}</button>
    <button class="btn btn-chrome icon-only" aria-label="Volver a cargar la página" ${site ? '' : 'disabled style="opacity:.4"'}>${I('rotate-cw')}</button>
  </div>
  ${site
    ? `<div class="omni" role="group" aria-label="Sitio abierto">${I('lock','sm')}<span class="muted k-estas" style="white-space:nowrap">Estás en</span><span class="dom"><span class="sub">${DOM.sub}</span><b>${DOM.main}</b></span></div>`
    : `<label class="omni" for="omni">${I('search','sm')}<span class="ph">Buscá un sitio o contá qué querés hacer</span></label><div class="spacer"></div>`}
  ${site ? `<button class="btn btn-help" aria-pressed="${helpOn}">${I('sparkles')}Ayuda</button>` : ''}
  <button class="btn btn-chrome">${I('a-large-small')}<span class="lbl-long">Tamaño de letra</span><span class="lbl-short">Letra</span></button>
</header>`;

/* ---------- Tarjeta flotante de ayuda ---------- */
const card = (body, o = {}) => `
<aside class="mm-card ${o.tone ? 'tone-' + o.tone : ''} ${o.bottom ? 'bottom' : ''}" aria-label="Ayuda de Mostrame">
  <div class="mm-card-head">
    <span class="who"><img src="${SYM}" alt="">Mostrame</span>
    <span class="spacer"></span>
    <button class="btn btn-quiet" style="border-color:transparent">${I('minus','sm')}Achicar</button>
  </div>
  ${o.noGoal ? '' : `<div class="mm-goal">Tu objetivo: <b>${GOAL}</b></div>`}
  <div class="mm-card-body">${body}</div>
  ${o.noFoot ? '' : `<nav class="mm-card-foot" aria-label="Controles de la ayuda">
    ${o.exitOnly ? '' : `<button class="btn btn-quiet" ${o.noRepeat ? 'disabled' : ''}>${I('rotate-ccw','sm')}Repetir</button>
    <button class="btn btn-quiet" ${o.noBack ? 'disabled' : ''}>${I('arrow-left','sm')}Volver un paso</button>`}
    <button class="btn btn-quiet">${I('log-out','sm')}Salir de la ayuda</button>
  </nav>`}
</aside>`;
const pill = (txt) => `<div class="mm-pill" role="region" aria-label="Ayuda de Mostrame, achicada"><img src="${SYM}" alt=""><span class="txt">${txt}</span><button class="btn btn-primary" style="min-height:var(--target-min)">${I('chevron-up','sm')}Abrir</button></div>`;

const doneList = (items) => `<section class="done-list"><h3>Ya hiciste</h3><ul>${items.map(t => `<li>${I('check')}<span>${t}</span></li>`).join('')}</ul></section>`;

/* ---------- Sitios de ejemplo (mock externo, una columna) ---------- */
const govHead = `<div class="gov-top"><div class="seal">ROU</div><div><div class="t1">Identificación Civil</div><div>Sitio de ejemplo · no es un organismo real</div></div></div>
<div class="gov-nav"><span>Inicio</span><span>Trámites</span><span>Agenda</span><span>Oficinas</span><span>Preguntas frecuentes</span><span>Contacto</span></div>`;
const tag = `<span class="mock-tag" style="left:10px;right:auto">Sitio externo de ejemplo</span>`;
const govAgenda = (hl) => `<div class="gov">${govHead}
<div class="gov-main one">
  <div class="crumbs">Inicio › Agenda › Cédula de identidad</div>
  <h1>Agenda de turnos para cédula de identidad</h1>
  <p>Desde este sitio podrá reservar día y hora para tramitar o renovar su cédula de identidad en cualquiera de nuestras oficinas habilitadas. Recuerde concurrir con la documentación requerida y con al menos 10 minutos de anticipación al horario reservado.</p>
  <p>Las reservas pueden realizarse con hasta 60 días de anticipación. En caso de no poder concurrir, le solicitamos cancelar su turno para liberar el cupo.</p>
  <div class="gov-btns">
    <span class="${hl ? 'hl-target' : ''}" style="display:inline-block"><button class="gov-btn">Sacar turno</button>${hl ? '<span class="hl-ring"></span><span class="hl-label">Acá</span>' : ''}</span>
    <button class="gov-btn alt">Consultar mi turno</button>
    <button class="gov-btn alt">Cancelar turno</button>
  </div>
  <aside class="gov-side"><b>Requisitos</b><ul><li>Cédula anterior</li><li>Comprobante de pago</li><li>Partida de nacimiento (si corresponde)</li></ul></aside>
  <h2>Avisos</h2>
  <div class="gov-news"><div><b>Horario de verano</b><br>Las oficinas del interior atienden de 8 a 14 h.</div><div><b>Costo del trámite</b><br>Consulte los valores vigentes en la sección Trámites.</div><div><b>Menores de edad</b><br>Deben concurrir con madre, padre o tutor.</div></div>
</div>${tag}</div>`;
const govOk = `<div class="gov">${govHead}<div class="gov-main one">
  <div class="crumbs">Inicio › Agenda › Confirmación</div><h1>Turno confirmado</h1>
  <div class="gov-ok"><b>✓ Su turno fue reservado con éxito</b>Martes 4 de noviembre · 10:30 h · Oficina Centro (Av. Ejemplo 1234).<br>Recibirá un correo electrónico con el detalle de su reserva.</div>
  <div class="gov-btns"><button class="gov-btn">Imprimir comprobante</button><button class="gov-btn alt">Volver al inicio</button></div>
  <aside class="gov-side"><b>Recuerde</b><ul><li>Concurrir 10 minutos antes</li><li>Llevar su cédula anterior</li></ul></aside>
</div>${tag}</div>`;
const govAmbig = `<div class="gov">${govHead}<div class="gov-main one">
  <div class="crumbs">Inicio › Agenda</div><h1>Gracias</h1>
  <p>Su solicitud fue recibida y está siendo procesada. En caso de corresponder, se le notificará por los medios registrados.</p>
  <div class="gov-btns"><button class="gov-btn alt">Volver al inicio</button></div>
  <aside class="gov-side"><b>Ayuda</b><p>Ante dudas comuníquese al 0800 0000.</p></aside>
</div>${tag}</div>`;
const govMap = `<div class="gov">${govHead}<div class="gov-main one">
  <div class="crumbs">Inicio › Oficinas</div><h1>Mapa de oficinas</h1>
  <div class="gov-map">[ Mapa interactivo ]</div>
  <div class="gov-frame">Ingreso con usuario de otro servicio<div class="in"></div><div class="in"></div></div>
</div>${tag}</div>`;

const HL = '<span class="hl-ring"></span><span class="hl-label">Acá</span>';
const HLS = '<span class="hl-ring"></span><span class="hl-label side">Acá</span>';
const HLB = '<span class="hl-ring"></span><span class="hl-label below">Acá</span>';
const govForm = (hl, err) => `<div class="gov">${govHead}<div class="gov-main one">
  <div class="crumbs">Inicio › Agenda › Reservar turno</div><h1>Reservar turno</h1>
  <div class="gov-steps">Complete los datos solicitados.</div>
  <div class="gov-form">
    <div><label>Oficina</label><span class="${hl === 'oficina' ? 'hl-target' : ''}" style="display:block"><div class="in2 ${err ? 'err' : ''}">Seleccione…</div>${hl === 'oficina' ? HLS : ''}</span>${err ? '<div class="msg">Debe seleccionar una oficina.</div>' : ''}</div>
    <div><label>Fecha</label><div class="in2">Seleccione…</div></div>
    <div><label>Número de documento</label><span class="${hl === 'doc' ? 'hl-target' : ''}" style="display:block"><div class="in2"></div>${hl === 'doc' ? HLS : ''}</span></div>
    <div class="gov-btns" style="margin-top:6px"><button class="gov-btn">Continuar</button><button class="gov-btn alt">Volver</button></div>
  </div>
</div>${tag}</div>`;
const govReview = (hl) => `<div class="gov">${govHead}<div class="gov-main one">
  <div class="crumbs">Inicio › Agenda › Reservar turno</div><h1>Revise su reserva</h1>
  <div class="gov-summary"><div><b>Oficina:</b> Oficina Centro</div><div><b>Fecha:</b> Martes 4 de noviembre · 10:30 h</div><div><b>Trámite:</b> Renovación de cédula</div></div>
  <p style="margin-top:12px">La reserva no quedará registrada hasta que la confirme.</p>
  <div class="gov-btns"><span class="${hl ? 'hl-target' : ''}" style="display:inline-block"><button class="gov-btn">Confirmar reserva</button>${hl ? HLB : ''}</span><button class="gov-btn alt">Modificar</button></div>
</div>${tag}</div>`;
const govFaq = `<div class="gov">${govHead}<div class="gov-main one">
  <div class="crumbs">Inicio › Preguntas frecuentes</div><h1>Preguntas frecuentes</h1>
  <h2>¿Cuánto cuesta renovar la cédula?</h2><p>El costo depende del tipo de trámite. Consulte la tabla de valores vigentes.</p>
  <h2>¿Puedo ir sin turno?</h2><p>Algunas oficinas atienden sin reserva previa según disponibilidad.</p>
  <h2>¿Qué pasa si pierdo mi turno?</h2><p>Puede reservar uno nuevo desde la Agenda.</p>
</div>${tag}</div>`;


/* ---------- Tienda de ejemplo (recorrido de compra) ---------- */
const SHOP = { sub: 'www.', main: 'tiendamac.ejemplo.com.uy' };
const shopHead = `<div class="shop-top"><div class="shop-logo">TiendaMac<span>Uruguay</span></div><div class="shop-search">Buscar productos…</div><div class="shop-links"><span>Mi cuenta</span><span>Carrito (CART)</span></div></div>
<div class="shop-nav"><span>Notebooks</span><span>Tablets</span><span>Celulares</span><span>Accesorios</span><span>Ofertas</span></div>`;
const laptop = `<svg viewBox="0 0 320 200" class="shop-img" aria-hidden="true"><rect x="40" y="18" width="240" height="150" rx="10" fill="#c9ccd1"/><rect x="50" y="28" width="220" height="130" rx="4" fill="#2d3340"/><path d="M14 170h292l-14 16H28z" fill="#b5b9bf"/><rect x="140" y="170" width="40" height="5" rx="2" fill="#9aa0a7"/></svg>`;
const shopTag = `<span class="mock-tag" style="left:10px;right:auto">Tienda de ejemplo · no es un comercio real</span>`;
const shopProduct = (hl) => `<div class="shop">${shopHead.replace('CART','0')}<div class="shop-main">
  <div class="crumbs">Inicio › Notebooks › MacBook</div>
  <div class="shop-prod">${laptop}
    <div class="shop-info"><div class="shop-badge">Revendedor autorizado</div>
      <h1>MacBook Air 13" chip M1 · 8 GB · 256 GB</h1>
      <div class="shop-price">US$ 899</div><div class="shop-small">Hasta 12 cuotas · Envío gratis a todo el país</div>
      <div class="shop-lbl">Color</div><div class="shop-colors"><button class="sel">Gris espacial</button><button>Plata</button><button>Oro</button></div>
      <div class="shop-btns"><span class="${hl ? 'hl-target' : ''}" style="display:inline-block"><button class="shop-btn">Agregar al carrito</button>${hl ? HLB : ''}</span><button class="shop-btn alt">Comprar ahora</button></div>
      <div class="shop-small">Garantía oficial de 1 año · Retiro en local o envío en 48 h</div>
    </div></div>
</div>${shopTag}</div>`;
const shopCart = (hl) => `<div class="shop">${shopHead.replace('CART','1')}<div class="shop-main">
  <div class="crumbs">Inicio › Carrito</div><h1 class="shop-h">Tu carrito</h1>
  <div class="shop-cart"><div class="shop-row">${laptop.replace('class="shop-img"','class="shop-thumb"')}<div><b>MacBook Air 13" chip M1 · 8 GB · 256 GB</b><div class="shop-small">Color: Gris espacial · Cantidad: 1</div></div><div class="shop-p">US$ 899</div></div>
  <div class="shop-tot"><div>Envío <span>Gratis</span></div><div class="big">Total <span>US$ 899</span></div></div>
  <div class="shop-btns" style="justify-content:flex-end"><button class="shop-btn alt">Seguir comprando</button><span class="${hl ? 'hl-target' : ''}" style="display:inline-block"><button class="shop-btn">Finalizar compra</button>${hl ? HLB : ''}</span></div></div>
</div>${shopTag}</div>`;
const shopShip = (hl) => `<div class="shop">${shopHead.replace('CART','1')}<div class="shop-main">
  <div class="crumbs">Carrito › <b>Envío</b> › Pago › Confirmación</div><h1 class="shop-h">¿Dónde lo recibís?</h1>
  <div class="gov-form" style="max-width:560px">
    <div><label>Nombre y apellido</label><div class="in2" style="color:#222">María López</div></div>
    <div><label>Dirección de envío</label><span class="${hl ? 'hl-target' : ''}" style="display:block"><div class="in2"></div>${hl ? HLS : ''}</span></div>
    <div><label>Departamento</label><div class="in2">Seleccione…</div></div>
    <div class="shop-btns"><button class="shop-btn">Continuar al pago</button></div>
  </div>
</div>${shopTag}</div>`;
const shopPay = (hl) => `<div class="shop">${shopHead.replace('CART','1')}<div class="shop-main">
  <div class="crumbs">Carrito › Envío › <b>Pago</b> › Confirmación</div><h1 class="shop-h">Pago con tarjeta</h1>
  <div class="gov-form" style="max-width:560px">
    <div><label>Número de tarjeta</label><span class="${hl ? 'hl-target' : ''}" style="display:block"><div class="in2"></div>${hl ? HLS : ''}</span></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label>Vencimiento</label><div class="in2">MM/AA</div></div><div><label>Código de seguridad</label><div class="in2"></div></div></div>
    <div><label>Cuotas</label><div class="in2">1 pago de US$ 899</div></div>
    <div class="shop-btns"><button class="shop-btn">Revisar pedido</button></div>
  </div>
</div>${shopTag}</div>`;
const shopReview = (hl) => `<div class="shop">${shopHead.replace('CART','1')}<div class="shop-main">
  <div class="crumbs">Carrito › Envío › Pago › <b>Confirmación</b></div><h1 class="shop-h">Revisá tu pedido</h1>
  <div class="gov-summary" style="max-width:560px"><div><b>Producto:</b> MacBook Air 13" M1 · Gris espacial</div><div><b>Envío:</b> a domicilio · Gratis</div><div><b>Pago:</b> tarjeta terminada en ••42 · 1 pago</div><div style="font-size:17px;margin-top:6px"><b>Total: US$ 899</b></div></div>
  <div class="shop-btns"><span class="${hl ? 'hl-target' : ''}" style="display:inline-block"><button class="shop-btn">Confirmar compra</button>${hl ? HLB : ''}</span><button class="shop-btn alt">Modificar</button></div>
</div>${shopTag}</div>`;
const shopDone = `<div class="shop">${shopHead.replace('CART','0')}<div class="shop-main">
  <div class="crumbs">Inicio › Pedido</div><h1 class="shop-h">¡Gracias por tu compra!</h1>
  <div class="gov-ok" style="max-width:560px"><b>✓ Pedido N.º 48213 confirmado</b>MacBook Air 13" M1 · US$ 899<br>Te enviamos el detalle por correo. Entrega estimada: jueves 23 de octubre.</div>
  <div class="shop-btns"><button class="shop-btn alt">Ver mi pedido</button><button class="shop-btn alt">Seguir comprando</button></div>
</div>${shopTag}</div>`;
const buy = (site, overlay) => { DOM = SHOP; GOAL = 'Comprar una MacBook Air M1 nueva'; return browse(site, overlay()); };


/* ---------- v1.4 · Inicio como buscador ---------- */
const searchHome = (q, opts = {}) => `<div class="app">${chrome(false)}<main class="search-home">
  <img class="wordmark" src="${LOGO}" alt="Mostrame">
  <div class="tag">Te muestro. Lo hacés vos.</div>
  <label class="sbox ${q ? 'is-focus' : ''}" for="q">${I('search')}<span class="q ${q ? '' : 'ph'}" id="q">${q ? q + '<span class="caret"></span>' : 'Buscá un sitio o contá qué querés hacer'}</span>${I('mic')}</label>
  <div class="sbtns"><button class="btn btn-quiet">Solo ir al sitio</button><button class="btn btn-primary">${I('sparkles','sm')}Mostrame cómo</button></div>
  ${q ? '' : `<div class="ssug"><span>Por ejemplo:</span><button class="chip">Sacar un turno</button><button class="chip">Pagar una factura</button><button class="chip">Comprar algo online</button></div>`}
  <footer class="sfoot"><span>Uruguay</span><span class="priv">${I('lock')}Nunca te voy a pedir contraseñas, números de documento ni datos de tu tarjeta.</span><span>Cómo funciona</span></footer>
</main></div>`;
const recoPage = (q, why, rec, others, note) => `<div class="app">${chrome(false)}<main class="reco">
  <div class="reco-top"><div class="sbox">${I('search')}<span class="q">${q}</span><button class="btn btn-primary go">${I('sparkles','sm')}Mostrame cómo</button></div></div>
  <div class="reco-main">
    <div class="reco-why"><img src="${SYM}" alt=""><p>${why}</p></div>
    ${rec}
    <h3 class="section-title" style="margin:var(--space-2) 0 0">Otras opciones</h3>
    <div class="others">${others}</div>
    ${note ? `<p class="why" style="margin:0">${I('circle-help','sm')}<span>${note}</span></p>` : ''}
    <div class="reco-more">${I('search','sm')}<span>¿No es esto? Contame un poco más en el buscador y te llevo directo.</span></div>
  </div></main></div>`;


/* ---------- v1.5 · Preguntas para entender qué busca ---------- */
const askPage = (q, done, question, opts, why) => `<div class="app">${chrome(false)}<main class="ask-page">
  <img class="wordmark" src="${LOGO}" alt="Mostrame">
  <div class="sbox" style="width:min(860px,100%)">${I('search')}<span class="q">${q}</span>${I('mic')}</div>
  <section class="ask-card" aria-labelledby="askq">
    <div class="lead2"><img src="${SYM}" alt="">Para llevarte directo al sitio justo, necesito un dato.</div>
    ${done.length ? `<div class="ask-done" aria-label="Lo que ya me contaste">${done.map(d => `<span>${I('check','sm')}${d}</span>`).join('')}</div>` : ''}
    <h2 id="askq">${question}</h2>
    <div class="ask-opts" role="group" aria-label="Elegí una respuesta">${opts.map((o, i) => `<button class="${i === 0 ? 'is-focus' : ''}">${I(o[1])}${o[0]}</button>`).join('')}<button class="unsure">${I('circle-help')}No estoy seguro</button></div>
    <div class="ask-foot"><p class="why">${I('circle-help','sm')}<span>${why}</span></p><span class="muted" style="font-size:var(--fs-sm)">¿Otra respuesta? Escribila en el buscador.</span></div>
  </section>
</main></div>`;

const browse = (site, overlay, helpOn = true) => `<div class="app">${chrome(true, helpOn)}<main class="view" aria-label="Página del sitio">${site}${overlay}</main></div>`;

/* ---------- Home / chat ---------- */
const avatar = `<div class="avatar"><img src="${SYM}" alt=""></div>`;
const userMsg = (t) => `<div class="msg-user"><span class="sr-only">Vos: </span>${t}</div>`;
const botMsg = (inner) => `<div class="msg-bot">${avatar}<div class="body">${inner}</div></div>`;
const composer = (ph = 'Escribí tu respuesta acá') => `<div class="composer"><div class="composer-inner"><label class="sr-only" for="c">Tu respuesta</label><input id="c" class="field" placeholder="${ph}"><button class="btn btn-primary">${I('send','sm')}Enviar</button></div></div>`;
const homeChat = (inner, comp = true) => `<div class="app">${chrome(false)}<div class="home"><div class="home-inner"><div class="chat">${inner}</div></div></div>${comp ? composer() : ''}</div>`;

const qClar = botMsg(`<p class="big">Te ayudo con eso. ¿En qué país es la cédula?</p>
  <div class="choices" role="group" aria-label="Elegí una respuesta"><button class="chip">Uruguay</button><button class="chip">Argentina</button></div>
  <p class="why">${I('circle-help','sm')}<span>Te pregunto porque el trámite es distinto en cada país.</span></p>`);

const screens = {
  inicio: () => `<div class="app">${chrome(false)}<div class="home"><div class="home-inner">
    <h1 class="display greeting">Buenas tardes.</h1>
    <p class="lead">Contame qué querés hacer en internet. Te muestro dónde se hace y te acompaño paso a paso. Vos hacés los clics.</p>
    <div class="intent-card">
      <label class="field-label" for="intent">¿Qué querés hacer hoy?</label>
      <div class="intent-row"><input id="intent" class="field is-focus" placeholder="Por ejemplo: renovar la cédula"><button class="btn btn-primary">Mostrame cómo${I('arrow-right','sm')}</button></div>
    </div>
    <h2 class="section-title">O empezá por una de estas:</h2>
    <div class="suggestions">
      <button class="card-btn">${I('calendar-check')}Sacar un turno</button>
      <button class="card-btn">${I('clock')}Ver un horario o una dirección</button>
      <button class="card-btn">${I('file-text')}Hacer un trámite del Estado</button>
    </div>
    <div class="privacy">${I('lock')}<div><b>Tu información es tuya.</b> Nunca te voy a pedir contraseñas, números de documento ni datos de tu tarjeta.</div></div>
  </div></div></div>`,

  aclaracion: () => homeChat(userMsg('Quiero renovar la cédula') + qClar),

  cargando: () => homeChat(userMsg('Quiero renovar la cédula') + qClar + userMsg('Uruguay') +
    botMsg(`<div class="loading" role="status"><div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="big" style="font-size:var(--fs-lg);font-weight:650">Estoy buscando dónde se hace este trámite.</div>
      <div class="muted" style="font-size:var(--fs-sm)">Suele tardar unos segundos.</div>
      <div style="margin-top:var(--space-3)"><button class="btn btn-quiet">Cancelar</button></div></div>`), false),

  sitios: () => `<div class="app">${chrome(false)}<div class="home"><div class="home-inner"><div class="chat">
    ${userMsg('Uruguay')}
    ${botMsg(`<p class="big">Encontré dónde hacerlo. Te recomiendo este sitio:</p>
    <article class="site-card recommended" aria-label="Sitio recomendado">
