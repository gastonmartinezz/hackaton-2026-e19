# Empaquetado técnico del cliente (S12). Firma, notarización y canal de
# actualizaciones quedan pendientes: publicación y distribución final por confirmar.
appId: ar.hackaton.navegador-asistido
productName: Navegador asistido
directories:
  output: release
# Ícono de la app: build/icon.png (1024×1024, desde design/assets/logo/guiame-icono.png).
icon: build/icon.png
files:
  - out/**
  - package.json
  # La ventana lo usa en Windows/Linux (app.getAppPath()/build/icon.png).
  - build/icon.png
asar: true
mac:
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  # Micrófono para el dictado del buscador (solo la interfaz propia; el sitio no puede usarlo).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Guíame usa el micrófono solo cuando tocás «Hablar» o, con «Voz» prendida, para que elijas una opción hablando.
win:
  target: nsis
linux:
  target: AppImage
