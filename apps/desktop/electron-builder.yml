# Empaquetado técnico del cliente (S12). Firma, notarización y canal de
# actualizaciones quedan pendientes: publicación y distribución final por confirmar.
appId: ar.hackaton.navegador-asistido
productName: Navegador asistido
directories:
  output: release
files:
  - out/**
  - package.json
asar: true
mac:
  target: dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  # Micrófono para el dictado del buscador (solo la interfaz propia; el sitio no puede usarlo).
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Mostrame usa el micrófono solo cuando tocás «Hablar», para escribir en el buscador lo que decís.
win:
  target: nsis
linux:
  target: AppImage
